[build]
  command = "npm run vercel-build"
  publish = ".next"

  [build.environment]
    # RESEND_API_KEY is only ever used in src/lib/email.ts, which imports
    # "server-only" — Next.js hard-fails the build if that module is ever
    # pulled into client code, so it structurally can't reach the browser.
    # CRON_SECRET is read the same way, in the Route Handler
    # src/app/api/cron/reminders/route.ts — Route Handlers never ship to
    # the client bundle either. Netlify's secrets scanner still flags both
    # inside the Turbopack build cache (not the shipped output), so they're
    # exempted here.
    SECRETS_SCAN_OMIT_KEYS = "RESEND_API_KEY,CRON_SECRET"

[[plugins]]
  package = "@netlify/plugin-nextjs"
